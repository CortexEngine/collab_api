spring:
  application:
    name: collab

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: collab-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  # Declina o uso do docker
  docker:
    compose:
      enabled: false

  # Atualiza os schemas do banco de dados --DEV
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      "[org.hibernate.envers.audit_table_suffix]": _history
      "[org.hibernate.envers.revision_field_name]": rev
      "[org.hibernate.envers.revision_type_field_name]": revtype
      "[org.hibernate.envers.store_data_at_delete]": true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}

    properties:
      "[sasl.mechanism]": ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      "[ssl.endpoint.identification.algorithm]": HTTPS
      "[ssl.truststore.location]": ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      "[ssl.truststore.password]": ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      "[ssl.truststore.type]": ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}

    admin:
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:false}
      fail-fast: ${KAFKA_ADMIN_FAIL_FAST:true}
      properties:
        "[sasl.jaas.config]": ${KAFKA_ADMIN_SASL_JAAS_CONFIG:}
        "[ssl.keystore.location]": ${KAFKA_ADMIN_SSL_KEYSTORE_LOCATION:}
        "[ssl.keystore.password]": ${KAFKA_ADMIN_SSL_KEYSTORE_PASSWORD:}
        "[ssl.keystore.type]": ${KAFKA_ADMIN_SSL_KEYSTORE_TYPE:PKCS12}
        "[ssl.key.password]": ${KAFKA_ADMIN_SSL_KEY_PASSWORD:}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        "[sasl.jaas.config]": ${KAFKA_PRODUCER_SASL_JAAS_CONFIG:}
        "[ssl.keystore.location]": ${KAFKA_PRODUCER_SSL_KEYSTORE_LOCATION:}
        "[ssl.keystore.password]": ${KAFKA_PRODUCER_SSL_KEYSTORE_PASSWORD:}
        "[ssl.keystore.type]": ${KAFKA_PRODUCER_SSL_KEYSTORE_TYPE:PKCS12}
        "[ssl.key.password]": ${KAFKA_PRODUCER_SSL_KEY_PASSWORD:}
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[enable.idempotence]": true

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:collab-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        "[sasl.jaas.config]": ${KAFKA_CONSUMER_SASL_JAAS_CONFIG:}
        "[ssl.keystore.location]": ${KAFKA_CONSUMER_SSL_KEYSTORE_LOCATION:}
        "[ssl.keystore.password]": ${KAFKA_CONSUMER_SSL_KEYSTORE_PASSWORD:}
        "[ssl.keystore.type]": ${KAFKA_CONSUMER_SSL_KEYSTORE_TYPE:PKCS12}
        "[ssl.key.password]": ${KAFKA_CONSUMER_SSL_KEY_PASSWORD:}
        "[spring.json.trusted.packages]": "com.example.collab.*"

app:
  kafka:
    topics:
      collaborator-created: collab.collaborator.created
      collaborator-updated: collab.collaborator.updated
      collaborator-deleted: collab.collaborator.deleted
      department-created: collab.department.created
      department-updated: collab.department.updated
      department-deleted: collab.department.deleted
    outbox:
      fixed-delay-ms: 5000
      max-attempts: 5